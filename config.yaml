# ServiceNow Agent Configuration

# ServiceNow Settings
snow:
  instance_url: "https://yourcompany.service-now.com"
  login_path: "/login.do"
  approvals_path: "/approvals.do"  # Or "/sysapproval_approver_list.do"
  
# IIS Server Settings
iis:
  base_url: "https://iis-server.company.com"
  login_path: "/login"
  asset_search_path: "/asset-search"

# Browser Settings
browser:
  headless: false  # Set to true for production
  slow_mo: 100     # Milliseconds between actions (helps with SSO)
  timeout: 30000   # Default timeout in ms

# Schedule Settings
schedule:
  enabled: true
  interval_minutes: 5  # Check every 5 minutes
  max_runs_per_day: 10  # Safety limit

# Logging
logging:
  log_dir: "./logs"
  log_file: "decisions.csv"
  log_level: "INFO"

# Credentials (USE ENVIRONMENT VARIABLES IN PRODUCTION)
# Never hardcode passwords!
credentials:
  snow_username: "${SNOW_USERNAME}"
  snow_password: "${SNOW_PASSWORD}"
  iis_username: "${IIS_USERNAME}"
  iis_password: "${IIS_PASSWORD}"

# CAD Rules (Placeholder - will be configured later)
cad_rules:
  enabled: false
  rules: []
